<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemSim — Interactive Virtual Chemistry Laboratory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#stage-content" class="skip-link">Skip to main content</a>
  <header id="app-header">
    <div class="header-left">
      <button id="btn-home" class="btn-icon" title="Home" aria-label="Return to home page">&#8962;</button>
      <span class="header-brand">ChemSim</span>
    </div>
    <div class="header-center">
      <h1 id="header-title">Interactive Virtual Chemistry Laboratory</h1>
    </div>
    <div class="header-right">
      <button id="btn-nav-back" class="btn-icon btn-nav" title="Back" aria-label="Go back" style="display:none;">&#8592;</button>
      <button id="btn-nav-forward" class="btn-icon btn-nav" title="Forward" aria-label="Go forward" style="display:none;">&#8594;</button>
    </div>
  </header>

  <main id="app-main">
    <div id="sidebar" role="navigation" aria-label="Experiment navigation">
      <h2>Experiments</h2>
      <ul id="practical-list"></ul>
    </div>

    <div id="workspace">
      <div id="stage-header">
        <h2 id="stage-title"></h2>
        <div id="stage-progress"></div>
      </div>

      <div id="stage-content"></div>

      <div id="simulation-area">
        <canvas id="sim-canvas" width="500" height="600" role="img" aria-label="Chemistry simulation visualization"></canvas>
      </div>

      <div id="feedback-area"></div>
      <div id="user-input-area"></div>

      <div id="action-bar">
        <button id="btn-back" class="btn btn-secondary" style="display:none;">Back</button>
        <button id="btn-next" class="btn btn-primary" style="display:none;">Next</button>
      </div>
    </div>
  </main>

  <footer id="app-footer">
    <p>ChemSim — Educational Simulation</p>
    <p class="disclaimer">Simulated values are for educational purposes only and are not real laboratory measurements.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
