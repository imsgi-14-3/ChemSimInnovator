<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemSim — Interactive Virtual Chemistry Laboratory</title>
  
  <!-- Design System & Styles -->
  <link rel="stylesheet" href="frontend/styles/design-system.css">
  <link rel="stylesheet" href="frontend/styles/layout.css">
  <link rel="stylesheet" href="frontend/styles/components.css">
  <link rel="stylesheet" href="frontend/styles/laboratory.css">
  <link rel="stylesheet" href="frontend/styles/responsive.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header" id="app-header">
      <div class="header-left">
        <button class="btn btn-ghost btn-sm header-home-btn" id="btn-home" aria-label="Home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
        <button class="btn btn-ghost btn-sm header-back-btn" id="btn-back" style="display:none;" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="header-brand">
          <span class="brand-name">ChemSim</span>
        </div>
      </div>
      <div class="header-center" id="header-center"></div>
      <div class="header-right">
        <div class="header-progress" id="header-progress" style="display:none;">
          <span class="progress-label" id="progress-label"></span>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <span class="progress-pct" id="progress-pct"></span>
        </div>
      </div>
    </header>

    <!-- Body -->
    <div class="app-body">
      <!-- Sidebar -->
      <aside class="app-sidebar" id="app-sidebar">
        <div class="sidebar-section">
          <h3 class="sidebar-heading">Navigation</h3>
          <nav class="sidebar-nav" id="sidebar-nav">
            <button class="sidebar-item active" data-screen="home">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span>Home</span>
            </button>
            <button class="sidebar-item" data-screen="pba">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              <span>PBA Practice</span>
            </button>
            <button class="sidebar-item" data-screen="mystery">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <span>Mystery Lab</span>
            </button>
            <button class="sidebar-item" data-screen="log">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <span>Experiment Log</span>
            </button>
            <button class="sidebar-item" data-screen="revision">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              <span>Learning & Revision</span>
            </button>
            <button class="sidebar-item" data-screen="demo">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span>Demo Mode</span>
            </button>
          </nav>
        </div>
        <div class="sidebar-section sidebar-experiments" id="sidebar-experiments" style="display:none;">
          <h3 class="sidebar-heading">Experiments</h3>
          <div class="sidebar-experiment-list" id="experiment-list"></div>
        </div>
      </aside>

      <!-- Main Workspace -->
      <main class="app-workspace" id="app-workspace">
        <div class="workspace-content" id="workspace-content"></div>
      </main>

      <!-- Instruction Panel -->
      <aside class="app-instruction-panel" id="instruction-panel">
        <div class="instruction-content" id="instruction-content">
          <div class="instruction-placeholder">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-light)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            <p>Select an experiment to begin</p>
          </div>
        </div>
      </aside>
    </div>

    <!-- Action Bar -->
    <footer class="app-action-bar" id="app-action-bar">
      <div class="action-left">
        <button class="btn btn-secondary" id="btn-action-back" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
      </div>
      <div class="action-center" id="action-center"></div>
      <div class="action-right">
        <button class="btn btn-ghost btn-sm" id="btn-action-reset" style="display:none;">Reset</button>
        <button class="btn btn-primary" id="btn-action-next" style="display:none;">
          Next
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Backend / Domain Layer -->
  <script src="backend/data/experiments.js"></script>
  <script src="backend/data/simulationConfig.js"></script>
  <script src="backend/data/pbaQuestions.js"></script>
  <script src="backend/domain/experimentEngine.js"></script>
  <script src="backend/domain/validationEngine.js"></script>
  <script src="backend/domain/calculationEngine.js"></script>
  <script src="backend/domain/scoringEngine.js"></script>
  <script src="backend/services/experimentService.js"></script>
  <script src="backend/services/pbaService.js"></script>
  <script src="backend/data/mysteryData.js"></script>
  <script src="backend/services/mysteryService.js"></script>
  <script src="backend/services/logService.js"></script>

  <!-- Frontend Services -->
  <script src="frontend/services/apiClient.js"></script>

  <!-- Main Application (defines ChemSim global, must load before screens) -->
  <script src="frontend/app.js"></script>

  <!-- Frontend Components -->
  <script src="frontend/components/AppShell.js"></script>
  <script src="frontend/components/Header.js"></script>
  <script src="frontend/components/ExperimentSidebar.js"></script>
  <script src="frontend/components/ProgressTracker.js"></script>
  <script src="frontend/components/ToolsPanel.js"></script>
  <script src="frontend/components/LaboratoryWorkspace.js"></script>
  <script src="frontend/components/InstructionPanel.js"></script>
  <script src="frontend/components/FeedbackPanel.js"></script>
  <script src="frontend/components/ActionBar.js"></script>

  <!-- Frontend Screens (call ChemSim.registerScreen) -->
  <script src="frontend/screens/HomeScreen.js"></script>
  <script src="frontend/screens/ExperimentScreen.js"></script>
  <script src="frontend/screens/ResultsScreen.js"></script>
  <script src="frontend/screens/PBAScreen.js"></script>
  <script src="frontend/screens/MysteryLabScreen.js"></script>
  <script src="frontend/screens/LogScreen.js"></script>
  <script src="frontend/screens/RevisionScreen.js"></script>
  <script src="frontend/screens/DemoScreen.js"></script>

  <!-- Frontend Renderers -->
  <script src="frontend/renderers/ChromatographyRenderer.js"></script>
  <script src="frontend/renderers/DistillationRenderer.js"></script>
  <script src="frontend/renderers/TitrationRenderer.js"></script>
  <script src="frontend/renderers/GasRenderer.js"></script>
  <script src="frontend/renderers/MinorExperimentRenderer.js"></script>
</body>
</html>
